<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบรายงานการปฏิบัติงาน รปภ.</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container my-4">
    <!-- โลโก้กองกายภาพ -->
    <div class="text-center mb-4">
        <img src="LOGO.png" alt="กองกายภาพและสิ่งแวดล้อม" style="max-width: 280px; height: auto;">
    </div>
    
    <!-- เพิ่ม id="pageMainTitle" เพื่อให้ JS ควบคุมการเปลี่ยนข้อความได้ -->
    <h4 id="pageMainTitle" class="text-center mb-4 fw-bold" style="color: #2c3e50;">รายงานจำนวน รปภ. ประจำวัน</h4>

    
    <form id="reportForm">
        <!-- ป้ายแจ้งเตือนสถานะการโหลดข้อมูล -->
        <div id="dataStatus" class="alert alert-warning text-center py-2 mb-3 shadow-sm" style="font-size: 0.9rem;">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            กำลังเชื่อมต่อฐานข้อมูลรายชื่อ...
        </div>

        <!-- ============================================== -->
        <!-- ส่วนที่ 1: หน้าเลือกพื้นที่ (ปุ่มกดแทน Dropdown) -->
        <!-- ============================================== -->
        <div id="unitSelectionView">
            <div class="d-grid gap-3 mx-auto mb-4 mt-4" style="max-width: 500px;">
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="ส่วนกลาง">ส่วนกลาง</button>
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="ศูนย์การเรียนรู้มหิดล">ศูนย์การเรียนรู้มหิดล</button>
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="มหิดลสิทธาคาร">มหิดลสิทธาคาร</button>
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="ลานจอดมหิดลสิทธาคาร">ลานจอดมหิดลสิทธาคาร</button>
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="อาคารสิริวิทยา">อาคารสิริวิทยา</button>
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="โครงการจัดตั้งสถาบันอุทยานธรรมชาติวิทยาสิรีรุกขชาติ">โครงการจัดตั้งสถาบันอุทยานธรรมชาติฯ</button>
                <button type="button" class="btn py-3 unit-btn fs-5 shadow-sm" data-unit="หอพักนักศึกษา">หอพักนักศึกษา</button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- ส่วนที่ 2: หน้าฟอร์มหลัก -->
        <!-- ============================================== -->
        <div id="mainFormView" style="display: none;">
            
            <!-- แถบปุ่มย้อนกลับ (เอาชื่อพื้นที่ทางขวาออก เพราะย้ายไปอยู่ใต้โลโก้แล้ว) -->
            <div class="mb-4 pb-3" style="border-bottom: 1px dashed #adb5bd;">
                <button type="button" class="btn btn-sm btn-outline-secondary px-3" id="backToUnitsBtn">⬅️ ย้อนกลับไปเลือกพื้นที่</button>
            </div>

            <input type="hidden" id="location" value="" required>

            <div class="row mb-4">
                <!-- เพิ่มคลาส d-none เพื่อซ่อนวันที่ปฏิบัติงานทั้งหมด -->
                <div class="col-md-6 mb-3 mb-md-0 d-none">
                    <label class="form-label fw-bold" style="color: #315d38;">วันที่ปฏิบัติงาน <span class="text-danger">*</span></label>
                    <input type="date" class="form-control form-control-lg" id="reportDate" required>
                </div>
                <!-- ปรับขนาดช่องผลัดการทำงานให้เต็มแถว (col-md-12) เมื่อซ่อนวันที่แล้ว -->
                <div class="col-md-12">
                    <label class="form-label d-block text-center fw-bold" style="color: #315d38;">ผลัดการทำงาน <span class="text-danger">*</span></label>
                    <div class="btn-group w-100 shadow-sm" role="group">
                        <input type="radio" class="btn-check" name="shift" id="shiftMorning" value="เช้า" required>
                        <label class="btn btn-outline-theme fs-5 py-2" for="shiftMorning">เช้า</label>

                        <input type="radio" class="btn-check" name="shift" id="shiftNight" value="กลางคืน">
                        <label class="btn btn-outline-theme fs-5 py-2" for="shiftNight">กลางคืน</label>
                    </div>
                </div>
            </div>

            <hr style="border-color: #a5c184;">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0 fw-bold" style="color: #315d38;">รายชื่อและจุดปฏิบัติงาน</h5>
                <h5 class="mb-0">ยอดรวม: <span id="totalCount" class="badge fs-5" style="background-color: #a5c184; color: #315d38;">0</span> คน</h5>
            </div>

            <!-- พื้นที่สำหรับแสดงกลุ่มจุดปฏิบัติงาน -->
            <div id="guardListContainer">
                <div class="alert alert-secondary text-center" style="background-color: #f4f7f4; border-color: #e2ebe2; color: #5a755d;">กรุณาเลือกผลัดการทำงานเพื่อแสดงจุดปฏิบัติงาน...</div>
            </div>

            <!-- ปุ่มสำหรับเพิ่มจุดปฏิบัติงานเองแบบ Manual -->
            <div class="mb-4 text-center mt-3" id="addCustomPostContainer" style="display: none;">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="addCustomPostBtn">
                    + เพิ่มจุดปฏิบัติงานอื่นๆ (นอกเหนือจากตาราง)
                </button>
            </div>
            
            <datalist id="guardNamesList"></datalist>

            <hr style="border-color: #a5c184;">
            
            <button type="submit" class="btn btn-theme w-100 fs-4 py-3 fw-bold shadow" id="submitBtn">บันทึกข้อมูลลง Google Sheet</button>
        </div>
    </form>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
